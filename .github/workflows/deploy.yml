name: PHP CI and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'Web_site/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Web_site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          tools: none
          coverage: none

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' php_files < <(find Web_site -type f -name '*.php' -print0)
          if [ "${#php_files[@]}" -eq 0 ]; then
            echo 'No PHP files found under Web_site.'
            exit 1
          fi
          for file in "${php_files[@]}"; do
            php -l "$file"
          done

  deploy:
    name: Deploy Web_site to production
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate FTP deployment settings
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          for name in FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing production environment secret: $name"
              exit 1
            fi
          done
          case "$FTP_SERVER_DIR" in
            /*) ;;
            *) echo '::error::FTP_SERVER_DIR must begin with /, for example /htdocs/.'; exit 1 ;;
          esac
          case "$FTP_SERVER_DIR" in
            */) ;;
            *) echo '::error::FTP_SERVER_DIR must end with /, for example /htdocs/.'; exit 1 ;;
          esac

      - name: Upload website files over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: Web_site/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.env
            **/.env.*
